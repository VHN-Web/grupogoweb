#cloud-config
# =============================================================================
# GoWeb · Servidor WhatsApp (Evolution API v2) no Google Cloud — instalação automática
# Usado por evolution-gcp.sh (metadado user-data da VM). Também serve na Azure ("Dados personalizados").
# Antes, confira o domínio na linha EVO_DOMAIN abaixo (precisa apontar para o IP da máquina).
# Sobe: Evolution API + PostgreSQL + Redis + Caddy (HTTPS automático, Let's Encrypt).
# A chave global é gerada aqui e fica em /opt/evolution/CHAVE.txt (nunca vai para o log).
# =============================================================================
write_files:
  - path: /opt/evolution/dominio.txt
    content: |
      EVO_DOMAIN=evo.goweboficial.com
  - path: /opt/evolution/docker-compose.yml
    content: |
      services:
        evolution:
          image: evoapicloud/evolution-api:v2.3.7
          restart: always
          env_file: .env
          volumes:
            - evolution_instances:/evolution/instances
          depends_on: [postgres, redis]
        postgres:
          image: postgres:16-alpine
          restart: always
          environment:
            POSTGRES_USER: evolution
            POSTGRES_DB: evolution
            POSTGRES_PASSWORD: ${PG_PASS}
          volumes:
            - pgdata:/var/lib/postgresql/data
        redis:
          image: redis:7-alpine
          restart: always
          command: ["redis-server", "--appendonly", "yes"]
          volumes:
            - redisdata:/data
        caddy:
          image: caddy:2
          restart: always
          ports: ["80:80", "443:443"]
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
          depends_on: [evolution]
      volumes:
        evolution_instances: {}
        pgdata: {}
        redisdata: {}
        caddy_data: {}
        caddy_config: {}
  - path: /opt/evolution/instalar.sh
    permissions: "0700"
    content: |
      #!/bin/bash
      set -euo pipefail
      cd /opt/evolution
      . ./dominio.txt
      # Docker oficial
      if ! command -v docker >/dev/null; then curl -fsSL https://get.docker.com | sh; fi
      systemctl enable --now docker
      # segredos gerados só na primeira vez
      if [ ! -f .env ]; then
        KEY=$(openssl rand -hex 32)
        PG=$(openssl rand -hex 20)
        umask 077
        echo "$KEY" > CHAVE.txt
        cat > .env <<ENV
      PG_PASS=$PG
      SERVER_URL=https://$EVO_DOMAIN
      AUTHENTICATION_API_KEY=$KEY
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      DEL_INSTANCE=false
      LANGUAGE=pt-BR
      CONFIG_SESSION_PHONE_CLIENT=GoWeb
      CONFIG_SESSION_PHONE_NAME=Chrome
      TELEMETRY=false
      LOG_LEVEL=ERROR,WARN
      DATABASE_ENABLED=true
      DATABASE_PROVIDER=postgresql
      DATABASE_CONNECTION_URI=postgresql://evolution:$PG@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME=evolution
      DATABASE_SAVE_DATA_INSTANCE=true
      DATABASE_SAVE_DATA_NEW_MESSAGE=false
      DATABASE_SAVE_MESSAGE_UPDATE=false
      DATABASE_SAVE_DATA_CONTACTS=false
      DATABASE_SAVE_DATA_CHATS=false
      DATABASE_SAVE_DATA_LABELS=false
      DATABASE_SAVE_DATA_HISTORIC=false
      CACHE_REDIS_ENABLED=true
      CACHE_REDIS_URI=redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY=evolution
      CACHE_REDIS_SAVE_INSTANCES=false
      CACHE_LOCAL_ENABLED=false
      ENV
      fi
      printf '%s {\n  encode gzip\n  reverse_proxy evolution:8080\n}\n' "$EVO_DOMAIN" > Caddyfile
      docker compose --env-file .env up -d
      # atualizações de segurança automáticas do Ubuntu
      apt-get install -y unattended-upgrades >/dev/null 2>&1 || true
      echo "GoWeb Evolution instalado em https://$EVO_DOMAIN" > /opt/evolution/STATUS.txt
runcmd:
  - [bash, /opt/evolution/instalar.sh]
